<div class="login">
  <form class="login-card" (ngSubmit)="submit()" novalidate>
    <img class="login-logo" src="assets/logo.png" alt="" width="64" height="64" />
    <span class="login-kicker">Studio</span>
    <h1 class="login-title">LinkedIn Automation</h1>
    <p class="login-sub">Log in to continue. You'll stay signed in on this browser for 7 days.</p>

    <p *ngIf="error" class="login-error" role="alert">
      <span class="icon icon-sm i-circle-alert"></span>
      <span>{{ error }}</span>
    </p>

    <label class="login-field">
      <span class="login-label">Username</span>
      <input
        type="text"
        name="username"
        [(ngModel)]="username"
        autocomplete="username"
        autocapitalize="off"
        spellcheck="false"
        required
        autofocus
      />
    </label>

    <label class="login-field">
      <span class="login-label">Password</span>
      <span class="password-wrap">
        <input
          [type]="showPassword ? 'text' : 'password'"
          name="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          required
        />
        <button
          type="button"
          class="reveal"
          (click)="showPassword = !showPassword"
          [attr.aria-pressed]="showPassword"
          [title]="showPassword ? 'Hide password' : 'Show password'"
        >
          {{ showPassword ? 'Hide' : 'Show' }}
        </button>
      </span>
    </label>

    <button type="submit" class="primary btn-block btn-lg login-submit" [disabled]="submitting">
      {{ submitting ? 'Logging in…' : 'Log in... :&#41;' }}
    </button>
  </form>
</div>
