<div class="theme-picker">
  <h3>Theme</h3>

  <div class="presets">
    <button
      type="button"
      class="swatch"
      *ngFor="let preset of presets"
      [class.active]="isActivePreset(preset)"
      (click)="choosePreset(preset)"
      [style.background]="preset.background"
      [style.color]="preset.text"
      [style.border-color]="preset.hover"
    >
      <span class="swatch-dot" [style.background]="preset.hover"></span>
      {{ preset.name }}
    </button>
  </div>

  <div class="custom">
    <h4>Custom colors</h4>
    <div class="custom-row">
      <label>
        <span>Background</span>
        <input type="color" [(ngModel)]="customColors.background" (change)="applyCustom()" />
        <input
          type="text"
          [(ngModel)]="customColors.background"
          (change)="applyCustom()"
          maxlength="7"
          aria-label="Background hex code"
        />
      </label>

      <label>
        <span>Text</span>
        <input type="color" [(ngModel)]="customColors.text" (change)="applyCustom()" />
        <input
          type="text"
          [(ngModel)]="customColors.text"
          (change)="applyCustom()"
          maxlength="7"
          aria-label="Text hex code"
        />
      </label>

      <label>
        <span>Hover</span>
        <input type="color" [(ngModel)]="customColors.hover" (change)="applyCustom()" />
        <input
          type="text"
          [(ngModel)]="customColors.hover"
          (change)="applyCustom()"
          maxlength="7"
          aria-label="Hover hex code"
        />
      </label>
    </div>
  </div>
</div>
